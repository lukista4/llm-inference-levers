[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-levers"
version = "0.1.0"
description = "Gate and accounting logic from a measured LLM inference/training lever study (vLLM, speculative decoding, tail-exit, grader-panel cost)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Unlicense"}
authors = [{name = "Lukáš Staník", email = "lukista4@gmail.com"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
